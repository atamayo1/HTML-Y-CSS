<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Anthony Tamayo Web</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <header>
        <a href="index.html" class="logo">ANTHONY TAMAYO WEB</a>
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icon-action">
            <div class="bx bx-menu" id="menu-icon"></div>
        </label>
        <ul class="navlist">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </header>

    <section class="contact">
        <div class="contact-text">
            <h1>Contacto</h1>
            <p>¿Tienes un proyecto en mente o deseas contratar mis servicios? ¡Hablemos!</p>
        </div>

        <form class="contact-form">
            <input type="text" placeholder="Nombre completo" required />
            <input type="email" placeholder="Correo electrónico" required />
            <textarea rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <button type="submit">Enviar mensaje</button>
        </form>
    </section>

    <div class="icons">
        <a href="#"><i class='bx bxl-instagram'></i></a>
        <a href="#"><i class='bx bxl-youtube'></i></a>
        <a href="#"><i class='bx bxl-facebook'></i></a>
        <a href="#"><i class='bx bxl-github'></i></a>
    </div>

    <footer>
        <p>&copy; 2025 Anthony Code Web. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
